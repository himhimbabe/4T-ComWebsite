name: 4t-comwebsite
services:
  website:
    build: .
    image: 4t-comwebsite:local
    container_name: 4T-ComWebsite
    ports:
      - "127.0.0.1:4180:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 3s
